        <div id="modalOverlay" class="d-none"></div>
        <div class="contact-modal d-none" id="contact-modal">
            <div class="container bg-white p-3 rounded-4 ">
                <div class="upsec pb-3 w-100 d-flex align-items-center justify-content-between">
                    <div>
                        <h2>Add New Contact</h2>
                    </div>
                    <div onclick="clickClose()" class="cls-btn"></div>
                </div>
                <div class="d-flex align-items-center justify-content-center flex-column mt-5">
                    <div class="img-sec d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="bgc rounded-4 ">
                        <label for="image" class="mt-3">
                            <i class="fa-solid fa-camera"></i>
                            <span>Change Photo</span>
                        </label>
                        <input type="file" id="image" name="image" class="d-none">
                    </div>
                </div>
                <div class="name-input my-4 d-flex flex-column ">
                    <label for="fullname">Full Name <span class="text-danger">*</span></label>
                    <input class="p-2 rounded-3" id="fullname" type="text" placeholder="Enter full name" required
                        oninput="validateName()">
                    <span id="nameError" class="text-danger" style="font-size: 13px;"></span>
                </div>
                <div class="phone-input my-4 d-flex flex-column ">
                    <label for="phone">Phone Number <span class="text-danger">*</span></label>
                    <input class="p-2 rounded-3" id="phone" type="tel" placeholder="e.g., 01012345678" required
                        oninput="validatePhone()">
                    <span id="phoneError" class="text-danger" style="font-size: 13px;"></span>
                </div>
                <div class="email-input my-4 d-flex flex-column ">
                    <label for="email">Email Address</label>
                    <input class="p-2 rounded-3" type="email" id="email" placeholder="name@example.com"
                        oninput="validateEmail()">
                    <span id="emailError" class="text-danger" style="font-size: 13px;"></span>
                </div>
                <div class="address-input my-4 d-flex flex-column ">
                    <label for="address">Address</label>
                    <input class="p-2 rounded-3" type="text" id="address" placeholder="Enter address">
                </div>
                <div class="group-input my-4 d-flex flex-column ">
                    <label for="group">Group</label>
                    <select class="p-2 rounded-3" name="group" id="group">
                        <option value="Select a group">Select a group</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                        <option value="Work">Work</option>
                        <option value="School">School</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="note-input my-4 d-flex flex-column ">
                    <label for="note">Notes</label>
                    <textarea class="p-2 rounded-3" id="note" type="text"
                        placeholder="Add notes about this contact"></textarea>
                </div>
                <div class="d-flex gap-5">
                    <div class="check-fav">
                        <input type="checkbox" id="fav">
                        <label class="ms-2" for="fav"><i class="fa-solid fa-star text-warning "></i> Favorite</label>
                    </div>
                    <div class="check-emrgnc">
                        <input type="checkbox" id="emrgnc">
                        <label class="ms-2" for="fav"><i class=" text-danger fa-solid fa-heart-pulse"></i>
                            Emergency</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="btn1">
                            <button onclick="clickClose()" class="p-2 rounded-3  my-4 w-100">Cancel</button>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="btn2">
                            <button onclick="saveContact()" class="p-2 rounded-3 w-100 my-4"><i
                                    class="fa-solid fa-check"></i> Save
                                Contact</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
